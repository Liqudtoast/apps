<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connor's little apps</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f6f5f2,#111214);--card:light-dark(#fff,#1b1d21);--ink:light-dark(#16171a,#eceef2);--mute:light-dark(#5e626b,#9da2ad);--line:light-dark(#e4e2dc,#2a2d33)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif;padding:24px}
main{width:min(520px,100%)}
h1{font-size:28px;margin:0 0 18px}
a{display:flex;align-items:center;gap:14px;padding:18px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);color:inherit;text-decoration:none;margin-bottom:12px}
a:hover,a:focus-visible{border-color:var(--ink);outline:none}
.ic{font-size:30px;width:52px;height:52px;display:grid;place-items:center;border-radius:12px}
b{display:block;font-size:18px}small{color:var(--mute)}
</style>
</head>
<body>
<main>
  <h1>My little apps</h1>
  <a href="karaoke/"><span class="ic" style="background:#0f2a6b">🎤</span><span><b>Karaoke Songbook</b><small>Go-to songs and a pick-for-me button</small></span></a>
  <a href="tees/"><span class="ic" style="background:#1f3fd1">👕</span><span><b>Tee Rotation</b><small>Today's shirt, no repeats</small></span></a>
</main>
</body>
</html>
